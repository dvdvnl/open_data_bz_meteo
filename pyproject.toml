[project]
name = "open_data_bz_meteo"
version = "1.0.0"
authors = [
  { name="david vnl", email="io@davole.com" },
]
description = "Python API client for the open meteo data V1 service, provided by Provincia autonoma di Bolzano - Informatica Alto Adige SPA."
readme = "README.md"
license = "CC-BY-SA-4.0"
requires-python = ">=3.12.0"
dependencies = [
    "requests>=2.28",
    "pydantic>=2.0",
]
classifiers = [
    "Programming Language :: Python :: 3.12"
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

# Optional groups for development and testing
[project.optional-dependencies]
develop = [
    "build>=1.4.0",
    "pytest-cov>=7.0",
    "pytest>=7.0",
    "requests-mock>=1.9.3",
    "twine>=6.2.0",
]

[project.urls]
Homepage = "https://github.com/dvdvnl/open_data_bz_meteo"
Issues = "https://github.com/dvdvnl/open_data_bz_meteo/issues"

[tool.pytest.ini_options]
addopts = "--cov=open_data_bz_meteo --cov-config=.coveragerc -q"
python_files = "tests/**/*.py"

