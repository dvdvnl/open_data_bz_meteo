[project]
name = "open_data_bz_meteo"
version = "1.0.0-alpha.1"
authors = [
  { name="david vnl", email="io@davole.com" },
]
description = "Python API client for the open meteo data V1 service, provided by Provincia autonoma di Bolzano - Informatica Alto Adige SPA."
readme = "README.md"
license = { text = "CC BY-SA 4.0" }
requires-python = ">=3.13"
dependencies = [
    "requests>=2.28",
    "pydantic>=2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

# Optional groups for development and testing
[project.optional-dependencies]
develop =[
    "build>=1.4.0",
    "twine>=6.2.0"
]
test = [
    "pytest>=7.0",
    "pytest-cov>=7.0",
    "responses>=0.23.1",
    "requests-mock>=1.9.3",
]

[project.urls]
Homepage = "https://github.com/dvdvnl/open_data_bz_meteo"
Issues = "https://github.com/dvdvnl/open_data_bz_meteo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py313']
